<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>버스 잼 프로토타입</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 장난감 같은 밝은 한 가지 세계로 고정 (라이트/다크 전환 없음)
   레이아웃: 위 승객 행렬 → 주차칸 → 주차장 → 부스터 바, 폰 세로 한 화면 */
:root {
  color-scheme: light;
  --bg: #dfe7f0;
  --plaza: #eef2f7;
  --ink: #1f2a37;
  --muted: #6b7686;
  --asphalt: #4a5361;
  --asphalt-line: #6c7584;
  --slot: #8a94a3;
  --slot-empty: #6f7a8a;
  --vip: #f4b62a;
  --vip-ink: #6b4500;
  --panel: #ffffff;
  --accent: #2f7cf6;
  --good: #20b26b;
  --bad: #e5484d;
  --c0: #ef4444; --c1: #3b82f6; --c2: #facc15; --c3: #22c55e; --c4: #a855f7; --c5: #22d3ee;
  --d0: #b91c1c; --d1: #1d4ed8; --d2: #ca8a04; --d3: #15803d; --d4: #7e22ce; --d5: #0e7490;
  --font-game: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-ui: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); font-size: 14px;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

#stage {
  position: relative; max-width: 440px; margin: 0 auto; min-height: 100%;
  display: flex; flex-direction: column; gap: 10px;
  padding-block: 10px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* 상단 바 */
.top { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; }
.round {
  width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--accent); color: #fff; box-shadow: 0 3px 0 #1d58b8;
}
.round:active { translate: 0 2px; box-shadow: 0 1px 0 #1d58b8; }
.round svg { width: 22px; height: 22px; }
.title { text-align: center; font-family: var(--font-game); line-height: 1.05; }
.title .lv { font-size: 26px; }
.title .tag { display: block; font-size: 15px; color: var(--bad); letter-spacing: .04em; min-height: 16px; }
.wallet { display: flex; gap: 6px; font-family: var(--font-game); font-size: 15px; }
.chip { display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 999px; background: var(--panel); font-variant-numeric: tabular-nums; }
.chip i { font-style: normal; }

/* 승객 행렬 */
.queue {
  position: relative; height: 148px; border-radius: 18px;
  background: var(--plaza); border: 2px solid #cfd8e3;
}
.queue::before { content: '탑승 순서: 아래 왼쪽부터'; position: absolute; left: 12px; top: 6px; font-size: 11px; color: var(--muted); }
.queue .left { position: absolute; right: 10px; top: 6px; font-family: var(--font-game); font-size: 13px; color: var(--muted); }

/* 주차칸 */
.slots { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; padding: 8px; border-radius: 16px; background: var(--slot); }
.slot { aspect-ratio: 5 / 8; border-radius: 9px; background: var(--slot-empty); display: grid; place-items: center; }
.slot.vip { background: var(--vip); color: var(--vip-ink); font-family: var(--font-game); font-size: 13px; }
.slot.vip span { rotate: -90deg; }
.slot.locked { background: transparent; border: 2px dashed #c3cad5; color: #eef2f7; font-size: 22px; font-family: var(--font-game); }
.slot.locked:active { scale: .95; }

/* 주차장 */
.lot { position: relative; border-radius: 18px; background: var(--asphalt); padding: 6px; }
.grid {
  position: relative; width: 100%; aspect-ratio: 7 / 8;
  background-image:
    linear-gradient(var(--asphalt-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--asphalt-line) 1px, transparent 1px);
  background-size: calc(100% / 7) calc(100% / 8);
  border-radius: 10px;
}

/* 차: 무대(stage) 좌표로 절대 배치 */
.veh {
  position: absolute; left: 0; top: 0; z-index: 3;
  border-radius: 10px; background: var(--col); box-shadow: inset 0 -5px 0 var(--dark), 0 2px 0 rgba(0,0,0,.25);
  transition: transform .26s ease-in, width .3s ease, height .3s ease, opacity .3s;
  display: grid; place-items: center; color: #fff;
}
.veh::before { /* 앞 유리: 머리 쪽 */
  content: ''; position: absolute; background: rgba(255,255,255,.55); border-radius: 5px;
}
.veh[data-dir="R"]::before { right: 5px; top: 18%; bottom: 22%; width: 18%; }
.veh[data-dir="L"]::before { left: 5px; top: 18%; bottom: 22%; width: 18%; }
.veh[data-dir="U"]::before { top: 5px; left: 18%; right: 18%; height: 18%; }
.veh[data-dir="D"]::before { bottom: 9px; left: 18%; right: 18%; height: 18%; }
.veh .arrow { width: 20px; height: 20px; opacity: .95; filter: drop-shadow(0 1px 0 rgba(0,0,0,.3)); }
.veh[data-dir="R"] .arrow { rotate: 0deg; } .veh[data-dir="D"] .arrow { rotate: 90deg; }
.veh[data-dir="L"] .arrow { rotate: 180deg; } .veh[data-dir="U"] .arrow { rotate: 270deg; }
.veh[data-size="bus"] { border-radius: 12px; }
.veh.mystery { --col: #2b2f36; --dark: #15181d; }
.veh.mystery .arrow { display: none; }
.veh.mystery::after { content: '?'; font-family: var(--font-game); font-size: 24px; color: #e5e7eb; }
.veh .seats { display: none; }
.veh.parked { box-shadow: inset 0 -4px 0 var(--dark); }
.veh.parked::before { top: 5px; left: 16%; right: 16%; height: 14%; bottom: auto; width: auto; }
.veh.parked .arrow { display: none; }
.veh.parked .seats { display: block; font-family: var(--font-game); font-size: 12px; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.35); margin-top: 10px; }
.veh.flying { z-index: 6; }
.veh.bump { animation: bump .28s ease-out; }
.veh.blocker { animation: flash .5s ease-out; }
.veh.full { animation: pulse .25s ease-out; }
.veh.depart { opacity: 0; }
.veh.hint { animation: hint 1s ease-in-out infinite; z-index: 4; }
.veh.pickable { outline: 3px solid var(--vip); outline-offset: 1px; }
@keyframes bump { 40% { translate: var(--bx) var(--by); } }
@keyframes flash { 30% { filter: brightness(1.6); scale: 1.04; } }
@keyframes pulse { 50% { scale: 1.12; } }
@keyframes hint { 50% { filter: brightness(1.25); scale: 1.05; } }

/* 승객 */
.pax {
  position: absolute; left: 0; top: 0; z-index: 2;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--col); box-shadow: inset 0 -3px 0 var(--dark);
  transition: transform .18s ease-out;
}
.pax.board { z-index: 7; transition: transform .22s ease-in, scale .22s; scale: .6; }

/* 부스터 */
.boosters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding-top: 2px; }
.boost {
  position: relative; aspect-ratio: 1; border-radius: 50%;
  background: #3b6fd8; color: #fff; display: grid; place-items: center;
  box-shadow: 0 4px 0 #234a99;
}
.boost:active { translate: 0 2px; box-shadow: 0 2px 0 #234a99; }
.boost svg { width: 46%; height: 46%; }
.boost .count {
  position: absolute; top: -4px; right: -4px; min-width: 26px; height: 26px; padding: 0 6px;
  border-radius: 13px; background: #25b34f; border: 2px solid #fff;
  font-family: var(--font-game); font-size: 15px; line-height: 22px; text-align: center;
}
.boost.shop { background: #f6c12b; color: #7a4b00; box-shadow: 0 4px 0 #b88200; }
.boost.active { background: var(--vip); box-shadow: 0 4px 0 #b88200; }
.boost[data-empty="true"] .count { background: var(--muted); }
.boost-label { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; text-align: center; font-size: 11px; color: var(--muted); margin-top: -4px; }

/* 안내 말풍선 */
.tip {
  position: absolute; left: 50%; translate: -50% 0; z-index: 8;
  padding: 6px 12px; border-radius: 999px; background: var(--ink); color: #fff;
  font-size: 13px; white-space: nowrap; pointer-events: none;
}

/* 시트(팝업) */
.sheet-wrap {
  position: fixed; inset: 0; z-index: 20; display: grid; align-items: end;
  background: rgba(20, 28, 40, .45);
  padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
}
.sheet {
  width: min(420px, 100%); margin: 0 auto; padding: 20px 18px 16px; border-radius: 22px;
  background: var(--panel); text-align: center; animation: rise .22s ease-out;
}
.sheet h2 { margin: 0 0 6px; font-family: var(--font-game); font-weight: 400; font-size: 26px; }
.sheet p { margin: 0 0 14px; color: var(--muted); line-height: 1.5; }
.sheet .btns { display: flex; flex-direction: column; gap: 8px; }
.btn { padding: 13px; border-radius: 14px; font-family: var(--font-game); font-size: 17px; background: #eef2f7; }
.btn.primary { background: var(--good); color: #fff; box-shadow: 0 3px 0 #13804b; }
.btn.gold { background: var(--vip); color: var(--vip-ink); box-shadow: 0 3px 0 #b88200; }
.btn small { display: block; font-family: var(--font-ui); font-size: 12px; opacity: .8; }
.btn:disabled { opacity: .45; }
.levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 12px; }
.levels button { aspect-ratio: 1; border-radius: 12px; background: #eef2f7; font-family: var(--font-game); font-size: 20px; }
.levels button[data-state="cleared"] { background: var(--good); color: #fff; }
.levels button[data-state="open"] { background: var(--accent); color: #fff; }
.levels button:disabled { opacity: .35; }
.toast {
  position: fixed; left: 50%; top: calc(76px + env(safe-area-inset-top, 0px)); translate: -50% 0; z-index: 30; max-width: calc(100% - 32px); white-space: nowrap;
  padding: 8px 16px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 14px;
  animation: rise .2s ease-out, fade .3s 2s forwards;
}
@keyframes rise { from { translate: -50% 16px; opacity: 0; } }
.sheet { animation-name: rise-s; }
@keyframes rise-s { from { transform: translateY(30px); opacity: 0; } }
@keyframes fade { to { opacity: 0; } }
.confetti { position: fixed; z-index: 25; width: 8px; height: 12px; top: -12px; border-radius: 2px; animation: fall 1.4s ease-in forwards; pointer-events: none; }
@keyframes fall { to { transform: translateY(105vh) rotate(540deg); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>


<div id="stage">
  <div class="top">
    <button id="btn-restart" class="round" type="button" aria-label="다시 시작">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
    <button id="btn-levels" class="title" type="button" aria-label="레벨 고르기">
      <span class="tag" id="tag"></span>
      <span class="lv" id="lv-title">레벨 1</span>
    </button>
    <div class="wallet">
      <span class="chip" title="하트"><i>❤</i><span id="hearts">5</span></span>
      <span class="chip" title="코인"><i>●</i><span id="coins">0</span></span>
    </div>
  </div>

  <div class="queue" id="queue"><span class="left" id="pax-left"></span></div>

  <div class="slots" id="slots">
    <div class="slot vip" data-slot="0"><span>VIP</span></div>
    <div class="slot" data-slot="1"></div>
    <div class="slot" data-slot="2"></div>
    <div class="slot" data-slot="3"></div>
    <div class="slot" data-slot="4"></div>
    <button class="slot locked" data-slot="5" type="button" aria-label="칸 열기">+</button>
    <button class="slot locked" data-slot="6" type="button" aria-label="칸 열기">+</button>
    <button class="slot locked" data-slot="7" type="button" aria-label="칸 열기">+</button>
  </div>

  <div class="lot"><div class="grid" id="grid"></div></div>

  <div class="boosters">
    <button class="boost" id="b-sort" type="button" aria-label="승객 정렬">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="7" r="2.5"/><path d="M3 20c0-3 2-5 4-5s4 2 4 5M13 20c0-3 2-5 4-5s4 2 4 5"/></svg>
      <span class="count" id="n-sort">2</span>
    </button>
    <button class="boost" id="b-shuffle" type="button" aria-label="차 섞기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15"/><path d="M4 20v-5h5"/></svg>
      <span class="count" id="n-shuffle">4</span>
    </button>
    <button class="boost" id="b-vip" type="button" aria-label="VIP로 빼기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h18M12 5v4"/><rect x="5" y="11" width="14" height="7" rx="3"/><path d="M8 18v2M16 18v2"/></svg>
      <span class="count" id="n-vip">2</span>
    </button>
    <button class="boost shop" id="b-shop" type="button" aria-label="상점">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9l1.5-5h13L20 9"/><path d="M4 9h16v2a3 3 0 0 1-5.3 2 3 3 0 0 1-5.4 0A3 3 0 0 1 4 11z"/><path d="M5 13v7h14v-7"/></svg>
    </button>
  </div>
  <div class="boost-label"><span>승객 정렬</span><span>차 섞기</span><span>VIP 빼기</span><span>상점</span></div>
</div>
<div id="layer"></div>

<script>
// 버스 잼 프로토타입 — 순수 규칙 (DOM 없음). 게임 화면과 레벨 생성기가 함께 씁니다.
//
// 좌표: 주차장은 cols × rows 격자. 차는 (x, y)부터 진행 방향 축으로 len칸을 차지합니다.
// 방향 U/D/L/R. 차는 머리 방향으로만 빠지고, 머리 앞부터 격자 끝까지 다른 차가 없어야 합니다.

const SIZES = {
  car: { len: 2, cap: 4 },
  van: { len: 3, cap: 6 },
  bus: { len: 4, cap: 10 },
};
const DIRS = {
  U: { dx: 0, dy: -1 }, D: { dx: 0, dy: 1 },
  L: { dx: -1, dy: 0 }, R: { dx: 1, dy: 0 },
};

// 차가 차지하는 칸 목록. (x, y)는 차의 '꼬리 쪽 위/왼쪽 끝'이 아니라 항상 좌상단 칸입니다.
function cellsOf(v) {
  const len = SIZES[v.size].len;
  const horiz = v.dir === 'L' || v.dir === 'R';
  const out = [];
  for (let i = 0; i < len; i++) out.push(horiz ? [v.x + i, v.y] : [v.x, v.y + i]);
  return out;
}

// 머리 칸 (진행 방향 쪽 끝)
function headOf(v) {
  const c = cellsOf(v);
  return v.dir === 'R' || v.dir === 'D' ? c[c.length - 1] : c[0];
}

// 머리 앞에서 격자 끝까지의 칸
function exitPath(v, cols, rows) {
  const { dx, dy } = DIRS[v.dir];
  let [x, y] = headOf(v);
  const out = [];
  for (;;) {
    x += dx; y += dy;
    if (x < 0 || y < 0 || x >= cols || y >= rows) return out;
    out.push([x, y]);
  }
}

function occupancy(vehicles, cols, rows, skipId = null) {
  const grid = new Array(cols * rows).fill(-1);
  for (const v of vehicles) {
    if (v.id === skipId) continue;
    for (const [x, y] of cellsOf(v)) grid[y * cols + x] = v.id;
  }
  return grid;
}

// 빠질 수 있으면 null, 막혔으면 막은 차 id
function blockerOf(v, vehicles, cols, rows, grid = occupancy(vehicles, cols, rows)) {
  for (const [x, y] of exitPath(v, cols, rows)) {
    const id = grid[y * cols + x];
    if (id !== -1 && id !== v.id) return id;
  }
  return null;
}

// ---------- 탑승 규칙 ----------
// slots: [{ id, color, cap, filled }] (빈 칸은 null). queue: 색 배열, qi: 맨 앞 승객 인덱스.
// 맨 앞 승객 색과 같은 차가 칸에 있으면 (먼저 들어온 차부터) 탄다. 가득 차면 출발.
// 이 함수는 한 명씩 태우는 대신 끝까지 한 번에 처리한 결과를 돌려줍니다 (풀이기용).
function settle(slots, queue, qi) {
  slots = slots.map(s => s && { ...s });
  for (;;) {
    if (qi >= queue.length) break;
    const c = queue[qi];
    const s = slots.find(s => s && s.color === c && s.filled < s.cap);
    if (!s) break;
    s.filled++; qi++;
    if (s.filled === s.cap) slots[slots.indexOf(s)] = null;
  }
  return { slots, qi };
}

// ---------- 풀이기 ----------
// 일반 주차칸 slotCount개만으로 풀 수 있는지 깊이 우선 탐색. 풀리면 차를 빼는 순서를 돌려줍니다.
function solve(level, slotCount = level.slots, nodeLimit = 200000) {
  const { cols, rows } = level;
  const all = level.vehicles;
  const n = all.length;
  const failed = new Set();
  let nodes = 0;
  const order = [];

  function key(alive, slots, qi) {
    return alive.join('') + '|' + qi + '|' + slots.map(s => s ? s.id + ':' + s.filled : '_').sort().join(',');
  }

  function dfs(alive, slots, qi) {
    if (qi >= level.queue.length) return true;
    if (++nodes > nodeLimit) throw new Error('limit');
    const k = key(alive, slots, qi);
    if (failed.has(k)) return false;
    const free = slots.indexOf(null);
    if (free === -1) { failed.add(k); return false; }
    const live = all.filter((v, i) => alive[i]);
    const grid = occupancy(live, cols, rows);
    // 맨 앞 승객과 같은 색 차를 먼저 시도 (탐색 가속)
    const front = level.queue[qi];
    const cands = live.filter(v => blockerOf(v, live, cols, rows, grid) === null)
      .sort((a, b) => (b.color === front) - (a.color === front));
    for (const v of cands) {
      const i = all.indexOf(v);
      const a2 = alive.slice(); a2[i] = 0;
      const s2 = slots.slice(); s2[free] = { id: v.id, color: v.color, cap: SIZES[v.size].cap, filled: 0 };
      const r = settle(s2, level.queue, qi);
      order.push(v.id);
      if (dfs(a2, r.slots, r.qi)) return true;
      order.pop();
    }
    failed.add(k);
    return false;
  }

  try {
    const ok = dfs(new Array(n).fill(1), new Array(slotCount).fill(null), 0);
    return { ok, order: ok ? order.slice() : null, nodes };
  } catch {
    return { ok: false, order: null, nodes, limit: true };
  }
}

// ---------- 난이도 측정용 플레이어 ----------
// '적당히 생각하는' 플레이어: 빠질 수 있는 차 중 맨 앞 승객 색 → 다음 몇 명 색 순으로 선호, 나머지는 무작위.
function playGreedy(level, rng, slotCount = level.slots, look = 12) {
  const { cols, rows } = level;
  let live = level.vehicles.slice();
  let slots = new Array(slotCount).fill(null);
  let qi = 0;
  while (qi < level.queue.length) {
    const free = slots.indexOf(null);
    if (free === -1) return false;
    const grid = occupancy(live, cols, rows);

    live = live.filter(o => o !== v);

  }

}

// 버스 잼 프로토타입 — 화면과 조작. 규칙 함수(SIZES, blockerOf 등)는 core.js에서 옵니다.

const $ = s => document.querySelector(s);
const stage = $('#stage');
const SAVE_KEY = 'busjam-proto-v1';
const PRICE = { slot: 120, revive: 150, booster: 100 };

// ---------- 저장 ----------
const save = loadSave();
function loadSave() {
  const base = { unlocked: 1, cleared: [], coins: 200, hearts: 5, boosters: { sort: 2, shuffle: 4, vip: 2 } };
  try {
    const raw = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (raw) return { ...base, ...raw, boosters: { ...base.boosters, ...(raw.boosters || {}) } };
  } catch { /* 저장 불가 환경 */ }
  return base;
}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch { /* 무시 */ } }

// ---------- 판 상태 ----------
let run = null;

function startLevel(n) {
  if (save.hearts <= 0) { heartsSheet(n); return; }
  const L = LEVELS[n - 1];
  clearBoard();
  run = {
    L, n,
    vehicles: L.vehicles.map(v => ({ ...v, where: 'lot', revealed: !v.mystery, el: null })),
    slots: new Array(8).fill(null),
    open: [true, true, true, true, true, false, false, false],
    queue: L.queue.slice(),
    qi: 0, seq: 0, over: false, moved: false, vipMode: false,
    pax: new Map(),
  };
  $('#lv-title').textContent = `레벨 ${n}`;
  $('#tag').textContent = L.hard ? 'HARD' : '';
  renderSlots();
  for (const v of run.vehicles) makeVehicle(v);
  layoutAll(true);
  updateHud();
  hints();
}

function clearBoard() {
  stage.querySelectorAll('.veh, .pax, .tip').forEach(e => e.remove());
}

const lotVehicles = () => run.vehicles.filter(v => v.where === 'lot');

// ---------- 그리기 ----------
const ARROW = '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>';

function setColor(el, c) { el.style.setProperty('--col', `var(--c${c})`); el.style.setProperty('--dark', `var(--d${c})`); }

function makeVehicle(v) {
  const el = document.createElement('button');
  el.type = 'button';
  el.className = 'veh';
  el.dataset.dir = v.dir;
  el.dataset.size = v.size;
  el.dataset.vid = v.id;
  el.setAttribute('aria-label', `${v.size} 차`);
  el.innerHTML = ARROW + '<span class="seats"></span>';
  if (v.mystery) el.classList.add('mystery'); else setColor(el, v.color);
  el.addEventListener('click', () => tapVehicle(v));
  stage.appendChild(el);
  v.el = el;
}

function rel(el) {
  const r = el.getBoundingClientRect(), s = stage.getBoundingClientRect();
  return { x: r.left - s.left, y: r.top - s.top, w: r.width, h: r.height };
}

function cellBox(v) {
  const g = rel($('#grid'));
  const cw = g.w / run.L.cols, ch = g.h / run.L.rows;
  const len = SIZES[v.size].len;
  const horiz = v.dir === 'L' || v.dir === 'R';
  return {
    x: g.x + v.x * cw + 3, y: g.y + v.y * ch + 3,
    w: (horiz ? len : 1) * cw - 6, h: (horiz ? 1 : len) * ch - 6, cw, ch,
  };
}

function place(el, b) {
  el.style.width = b.w + 'px';
  el.style.height = b.h + 'px';
  el.style.transform = `translate(${b.x}px, ${b.y}px)`;
}

function slotBox(i) {
  const b = rel(document.querySelector(`.slot[data-slot="${i}"]`));
  return { x: b.x + 2, y: b.y + 2, w: b.w - 4, h: b.h - 4 };
}

function layoutAll(instant) {
  if (!run) return;
  const els = [];
  for (const v of run.vehicles) {
    if (!v.el) continue;
    els.push(v.el);
    if (v.where === 'lot') place(v.el, cellBox(v));
    else if (v.where === 'slot' || v.where === 'moving') { const i = run.slots.findIndex(s => s && s.vid === v.id); if (i >= 0) place(v.el, slotBox(i)); }
  }
  layoutPax(instant);
  if (instant) {
    els.forEach(e => { e.style.transition = 'none'; });
    stage.offsetHeight; // 강제 리플로우
    els.forEach(e => { e.style.transition = ''; });
  }
}

// 승객: 앞사람이 왼쪽 아래, 지그재그로 뒤로 줄 섬
function paxGeom() {
  const q = rel($('#queue'));
  const step = 20, pad = 12;
  const cols = Math.max(4, Math.floor((q.w - pad * 2 + 4) / step));
  const rows = Math.max(2, Math.floor((q.h - pad * 2 + 4) / step));
  return { q, step, pad, cols, rows, visible: cols * rows };
}
function paxPos(k, g) {
  const row = Math.floor(k / g.cols), col = k % g.cols;
  const cx = row % 2 === 0 ? col : g.cols - 1 - col;
  return { x: g.q.x + g.pad + cx * g.step, y: g.q.y + g.q.h - g.pad - 16 - row * g.step };
}
function layoutPax(instant) {
  const g = paxGeom();
  const end = Math.min(run.queue.length, run.qi + g.visible);
  for (let i = run.qi; i < end; i++) {
    let el = run.pax.get(i);
    const p = paxPos(i - run.qi, g);
    if (!el) {
      el = document.createElement('span');
      el.className = 'pax';
      stage.appendChild(el);
      run.pax.set(i, el);
      el.style.transition = 'none';
      el.style.transform = `translate(${p.x}px, ${p.y - 10}px)`;
      el.offsetHeight;
      el.style.transition = '';
    }
    setColor(el, run.queue[i]);
    el.style.transform = `translate(${p.x}px, ${p.y}px)`;
    if (instant) { el.style.transition = 'none'; el.offsetHeight; el.style.transition = ''; }
  }
  const left = run.queue.length - end;
  $('#pax-left').textContent = left > 0 ? `+${left}명 대기` : '';
}

function renderSlots() {
  document.querySelectorAll('.slot').forEach((el, i) => {
    if (i < 5) return;
    el.classList.toggle('locked', !run.open[i]);
    el.textContent = run.open[i] ? '' : '+';
    el.disabled = run.open[i];
  });
}

function updateHud() {
  $('#hearts').textContent = save.hearts;
  $('#coins').textContent = save.coins;
  for (const k of ['sort', 'shuffle', 'vip']) {
    $('#n-' + k).textContent = save.boosters[k] > 0 ? save.boosters[k] : '+';
    $('#b-' + k).dataset.empty = String(save.boosters[k] <= 0);
  }
  $('#b-vip').classList.toggle('active', !!run?.vipMode);
}

// ---------- 차 탭 ----------
function tapVehicle(v) {
  if (!run || run.over || v.where !== 'lot') return;
  clearHint();
  if (run.vipMode) { sendToVip(v); return; }

  const lot = lotVehicles();
  const blocker = blockerOf(v, lot, run.L.cols, run.L.rows);
  if (blocker !== null) {
    bump(v);
    const b = run.vehicles.find(o => o.id === blocker);
    retrigger(b.el, 'blocker');
    return;
  }
  const i = freeSlot();
  if (i === -1) { bump(v); toast('주차칸이 꽉 찼어요'); return; }
  buzz();
  run.moved = true;
  reveal(v);
  run.slots[i] = { vid: v.id, color: v.color, cap: SIZES[v.size].cap, filled: 0, ready: false, seq: ++run.seq };
  v.where = 'moving';

  // 1단계: 머리 방향으로 쭉 빠짐
  const b = cellBox(v);
  const { dx, dy } = DIRS[v.dir];
  const [hx, hy] = headOf(v);
  const toEdge = dx > 0 ? run.L.cols - 1 - hx : dx < 0 ? hx : dy > 0 ? run.L.rows - 1 - hy : hy;
  const dist = (toEdge + SIZES[v.size].len + 0.4) * (dx ? b.cw : b.ch);
  v.el.classList.add('flying');
  v.el.style.transform = `translate(${b.x + dx * dist}px, ${b.y + dy * dist}px)`;
  // 2단계: 주차칸으로
  setTimeout(() => {
    v.el.classList.add('parked');
    place(v.el, slotBox(i));
    setTimeout(() => { arrive(v, i); }, 300);
  }, 260);
}

function arrive(v, i) {
  v.where = 'slot';
  v.el.classList.remove('flying');
  if (run.slots[i]) run.slots[i].ready = true;
  seatLabel(v, run.slots[i]);
}

function freeSlot() {
  for (let i = 1; i < 8; i++) if (run.open[i] && !run.slots[i]) return i;
  return -1;
}

function reveal(v) {
  if (v.revealed) return;
  v.revealed = true;
  v.el.classList.remove('mystery');
  setColor(v.el, v.color);
}

function bump(v) {
  const { dx, dy } = DIRS[v.dir];
  v.el.style.setProperty('--bx', dx * 6 + 'px');
  v.el.style.setProperty('--by', dy * 6 + 'px');
  retrigger(v.el, 'bump');
}
function retrigger(el, cls) { el.classList.remove(cls); el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), 600); }
function buzz() { try { navigator.vibrate?.(8); } catch { /* 무시 */ } }

function seatLabel(v, s) { if (s) v.el.querySelector('.seats').textContent = `${s.filled}/${s.cap}`; }

// ---------- 탑승 루프 ----------
setInterval(step, 85);

function step() {
  if (!run || run.over) return;
  if (run.qi < run.queue.length) {
    const c = run.queue[run.qi];
    const s = run.slots.filter(s => s && s.ready && !s.leaving && s.color === c && s.filled < s.cap).sort((a, b) => a.seq - b.seq)[0];
    if (s) board(s);
  }
  checkEnd();
}

function board(s) {
  const i = run.slots.indexOf(s);
  const v = run.vehicles.find(o => o.id === s.vid);
  const el = run.pax.get(run.qi);
  run.pax.delete(run.qi);
  run.qi++;
  s.filled++;
  seatLabel(v, s);
  if (el) {
    const b = slotBox(i);
    el.classList.add('board');
    el.style.transform = `translate(${b.x + b.w / 2 - 8}px, ${b.y + b.h / 2 - 8}px)`;
    setTimeout(() => el.remove(), 230);
  }
  layoutPax(false);
  if (s.filled === s.cap) {
    s.leaving = true;
    retrigger(v.el, 'full');
    setTimeout(() => {
      v.el.style.transform += ' translateY(-60px)';
      v.el.classList.add('depart');
      setTimeout(() => { v.el.remove(); v.el = null; v.where = 'gone'; }, 320);
      run.slots[i] = null;
    }, 260);
  }
}

function checkEnd() {
  if (run.qi >= run.queue.length) {
    if (run.slots.every(s => !s)) win();
    return;
  }
  // 움직이는 중이거나 떠나는 중이면 아직 판정 안 함
  if (run.slots.some(s => s && (!s.ready || s.leaving))) return;
  if (freeSlot() !== -1) return;
  const c = run.queue[run.qi];
  if (run.slots.some(s => s && s.color === c && s.filled < s.cap)) return;
  if (run.vipMode) return;
  lose();
}

// ---------- 부스터 ----------
$('#b-sort').addEventListener('click', () => useBooster('sort'));
$('#b-shuffle').addEventListener('click', () => useBooster('shuffle'));
$('#b-vip').addEventListener('click', () => useBooster('vip'));
$('#b-shop').addEventListener('click', shopSheet);

function useBooster(k) {
  if (!run || run.over) return;
  if (save.boosters[k] <= 0) { shopSheet(); return; }
  if (k === 'vip') {
    if (run.vipMode) { setVip(false); return; }
    if (run.slots[0]) { toast('VIP 칸이 이미 차 있어요'); return; }
    setVip(true);
    return;
  }
  if (k === 'sort') {
    // 지금 주차칸에 있는 색 승객을 앞으로 (순서는 유지)
    const inSlot = new Set(run.slots.filter(s => s && !s.leaving).map(s => s.color));
    if (!inSlot.size) { toast('주차칸에 차가 있어야 써요'); return; }
    const rest = run.queue.slice(run.qi);
    const a = rest.filter(c => inSlot.has(c)), b = rest.filter(c => !inSlot.has(c));
    run.queue.splice(run.qi, rest.length, ...a, ...b);
    layoutPax(false);
    toast('승객 줄을 정리했어요');
  }
  if (k === 'shuffle') {
    const lot = lotVehicles();
    if (lot.length < 2) { toast('섞을 차가 부족해요'); return; }
    for (const size of Object.keys(SIZES)) {
      const g = lot.filter(v => v.size === size);
      const cols = g.map(v => v.color);
      for (let i = cols.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [cols[i], cols[j]] = [cols[j], cols[i]]; }
      g.forEach((v, i) => { v.color = cols[i]; if (v.revealed) setColor(v.el, v.color); retrigger(v.el, 'blocker'); });
    }
    toast('같은 크기끼리 색을 섞었어요');
  }
  save.boosters[k]--;
  persist(); updateHud();
}

function setVip(on) {
  run.vipMode = on;
  lotVehicles().forEach(v => v.el.classList.toggle('pickable', on));
  stage.querySelectorAll('.tip').forEach(e => e.remove());
  if (on) tip('VIP 칸으로 보낼 차를 고르세요', rel($('#grid')).y - 30);
  updateHud();
}

function sendToVip(v) {
  setVip(false);
  save.boosters.vip--; persist(); updateHud();
  run.moved = true;
  reveal(v);
  run.slots[0] = { vid: v.id, color: v.color, cap: SIZES[v.size].cap, filled: 0, ready: false, seq: ++run.seq };
  v.where = 'moving';
  v.el.classList.add('flying', 'parked');
  place(v.el, slotBox(0));
  setTimeout(() => arrive(v, 0), 420);
}

// ---------- 잠긴 칸 ----------
document.querySelectorAll('.slot.locked').forEach(el => el.addEventListener('click', () => {
  if (!run || run.over || run.open[+el.dataset.slot]) return;
  sheet({
    title: '칸 열기', body: '이번 판에서만 주차칸이 하나 늘어나요.',
    buttons: [
      { label: `${PRICE.slot}코인으로 열기`, cls: 'gold', disabled: save.coins < PRICE.slot, on: () => { save.coins -= PRICE.slot; openSlot(); } },
      { label: '광고 보고 열기', sub: '프로토타입이라 바로 열려요', on: openSlot },
      { label: '닫기' },
    ],
  });
}));

function openSlot() {
  const i = run.open.findIndex((o, k) => k >= 5 && !o);
  if (i === -1) return false;
  run.open[i] = true;
  renderSlots(); persist(); updateHud();
  return true;
}

// ---------- 결과 ----------
function win() {
  run.over = true;
  const reward = run.L.hard ? 40 : 20;
  save.coins += reward;
  if (!save.cleared.includes(run.n)) save.cleared.push(run.n);
  save.unlocked = Math.max(save.unlocked, Math.min(LEVELS.length, run.n + 1));
  persist(); updateHud(); confetti();
  const last = run.n === LEVELS.length;
  setTimeout(() => sheet({
    title: last ? '10레벨 모두 클리어!' : '클리어!',
    body: `코인 +${reward}${last ? ' · 프로토타입은 여기까지예요' : ''}`,
    buttons: last
      ? [{ label: '레벨 고르기', cls: 'primary', on: levelsSheet }]
      : [{ label: `레벨 ${run.n + 1} 하기`, cls: 'primary', on: () => startLevel(run.n + 1) }, { label: '한 번 더', on: () => startLevel(run.n) }],
  }), 500);
}

function lose() {
  run.over = true;
  buzz();
  const canSlot = run.open.some((o, k) => k >= 5 && !o);
  sheet({
    title: '주차칸이 꽉 찼어요!',
    body: `남은 승객 ${run.queue.length - run.qi}명. 칸이 하나만 더 있으면 이어갈 수 있어요.`,
    buttons: [
      { label: `칸 +1 하고 이어하기`, sub: `${PRICE.revive}코인`, cls: 'gold', disabled: !canSlot || save.coins < PRICE.revive, on: () => { save.coins -= PRICE.revive; revive(); } },
      { label: '광고 보고 이어하기', sub: '프로토타입이라 바로 이어져요', disabled: !canSlot, on: revive },
      { label: '다시 하기', sub: '하트 -1', on: () => { save.hearts = Math.max(0, save.hearts - 1); persist(); startLevel(run.n); } },
    ],
  });
}

function revive() { openSlot(); run.over = false; }

// ---------- 시트 ----------
function sheet({ title, body, buttons, extra }) {
  closeSheet();
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  wrap.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><h2></h2><p></p>${extra ?? ''}<div class="btns"></div></div>`;
  wrap.querySelector('h2').textContent = title;
  wrap.querySelector('p').textContent = body;
  for (const b of buttons) {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'btn ' + (b.cls ?? '');
    el.textContent = b.label;
    if (b.sub) { const s = document.createElement('small'); s.textContent = b.sub; el.appendChild(s); }
    el.disabled = !!b.disabled;
    el.addEventListener('click', () => { closeSheet(); b.on?.(); });
    wrap.querySelector('.btns').appendChild(el);
  }
  document.body.appendChild(wrap);
  return wrap;
}
function closeSheet() { document.querySelectorAll('.sheet-wrap').forEach(e => e.remove()); }

function levelsSheet() {
  const extra = '<div class="levels">' + LEVELS.map((L, i) => {
    const n = i + 1;
    const st = save.cleared.includes(n) ? 'cleared' : n <= save.unlocked ? 'open' : 'locked';
    return `<button type="button" data-n="${n}" data-state="${st}" ${n > save.unlocked ? 'disabled' : ''}>${n}</button>`;
  }).join('') + '</div>';
  const w = sheet({
    title: '레벨 고르기', body: 'HARD: 5, 10',
    extra,
    buttons: [{ label: '진행 초기화', on: () => { try { localStorage.removeItem(SAVE_KEY); } catch { /* 무시 */ } location.reload(); } }, { label: '닫기' }],
  });
  w.querySelectorAll('.levels button').forEach(b => b.addEventListener('click', () => { closeSheet(); startLevel(+b.dataset.n); }));
}

function shopSheet() {
  const buy = k => () => { save.coins -= PRICE.booster; save.boosters[k]++; persist(); updateHud(); shopSheet(); };
  sheet({
    title: '상점', body: `보유 코인 ${save.coins} · 프로토타입이라 실제 결제는 없어요`,
    buttons: [
      { label: '승객 정렬 +1', sub: `${PRICE.booster}코인`, disabled: save.coins < PRICE.booster, on: buy('sort') },
      { label: '차 섞기 +1', sub: `${PRICE.booster}코인`, disabled: save.coins < PRICE.booster, on: buy('shuffle') },
      { label: 'VIP 빼기 +1', sub: `${PRICE.booster}코인`, disabled: save.coins < PRICE.booster, on: buy('vip') },
      { label: '테스트용 코인 +500', cls: 'gold', on: () => { save.coins += 500; persist(); updateHud(); shopSheet(); } },
      { label: '닫기' },
    ],
  });
}

function heartsSheet(n) {
  sheet({
    title: '하트가 없어요', body: '원래는 25분마다 하나씩 차요. 프로토타입이라 바로 채울 수 있어요.',
    buttons: [{ label: '하트 채우기', cls: 'primary', on: () => { save.hearts = 5; persist(); updateHud(); startLevel(n); } }],
  });
}

$('#btn-levels').addEventListener('click', levelsSheet);
$('#btn-restart').addEventListener('click', () => {
  if (!run) return;
  if (!run.moved || run.over) { startLevel(run.n); return; }
  sheet({
    title: '다시 시작할까요?', body: '하던 판을 그만두면 하트가 1개 줄어요.',
    buttons: [
      { label: '다시 시작', sub: '하트 -1', cls: 'primary', on: () => { save.hearts = Math.max(0, save.hearts - 1); persist(); startLevel(run.n); } },
      { label: '계속하기' },
    ],
  });
});

// ---------- 안내 ----------
let hintEl = null;
function hints() {
  const n = run.n;
  if (n === 1) {
    const lot = lotVehicles();
    const front = run.queue[0];
    const v = lot.find(v => v.color === front && blockerOf(v, lot, run.L.cols, run.L.rows) === null)
      ?? lot.find(v => blockerOf(v, lot, run.L.cols, run.L.rows) === null);
    if (v) { v.el.classList.add('hint'); hintEl = v.el; }
    tip('맨 앞 손님 색과 같은 차를 눌러 꺼내요', rel($('#grid')).y - 30);
  }
  if (n === 3) toast('큰 차는 손님을 더 많이 태워요');
  if (n === 5 || n === 10) toast('HARD 레벨! 순서를 잘 생각해요');
  if (n === 6) toast('? 차는 꺼내야 색이 보여요');
}
function clearHint() {
  if (hintEl) { hintEl.classList.remove('hint'); hintEl = null; }
  if (!run.vipMode) stage.querySelectorAll('.tip').forEach(e => e.remove());
}
function tip(text, y) {
  const el = document.createElement('div');
  el.className = 'tip';
  el.textContent = text;
  el.style.top = Math.max(0, y) + 'px';
  stage.appendChild(el);
}
function toast(text) {
  document.querySelectorAll('.toast').forEach(e => e.remove());
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2400);
}
function confetti() {
  const cols = ['--c0', '--c1', '--c2', '--c3', '--c4', '--c5'];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('span');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = `var(${cols[i % cols.length]})`;
    c.style.animationDelay = Math.random() * 0.4 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 2000);
  }
}

// ---------- 시작 ----------
// 개발·테스트용: 콘솔에서 __bus.run 으로 판 상태 확인
window.__bus = { get run() { return run; }, save };
new ResizeObserver(() => layoutAll(true)).observe(stage);
updateHud();
startLevel(Math.min(save.unlocked, LEVELS.length));

</script>

</body>
</html>
